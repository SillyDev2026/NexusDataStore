name: NexusDataStore Source Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-compatibility:
    name: Static release invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Enforce same-line Luau local assignments
        run: python3 tools/check_luau_style.py
      - name: Verify version, API, codec and benchmark scripts
        run: python3 tools/verify_release.py

  luau-behavior:
    name: Luau compile and behavioral regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official Luau source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: 2a3d8937c19c8fd9f7b72b6ec9068c62760e6588
          path: .luau-toolchain
      - name: Build Luau CLI
        run: make -C .luau-toolchain config=release luau luau-compile -j2
      - name: Compile library and regression scripts
        run: .luau-toolchain/luau-compile --null DataStore.lua Compression.lua Data.lua SoftShutdownClient.client.lua tests/*.lua tests/*.luau
      - name: Execute session and compression regressions
        run: python3 tools/run_behavioral_tests.py --luau .luau-toolchain/luau
